<text x="170" y="96" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#555" text-anchor="start" font-weight="normal" xml:space="preserve">La fábrica baja a escala entera ×2; el espacio que sobra se lo lleva el editor. Cotas en px reales de la pantalla de 1366×768.</text>

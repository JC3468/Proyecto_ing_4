<text x="2065.8" y="160" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="22" fill="#111" text-anchor="start" font-weight="bold" xml:space="preserve">Especificaciones</text>
<text x="2065.8" y="204" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="17" fill="#D6336C" text-anchor="start" font-weight="bold" xml:space="preserve">Por qué escala entera</text>
<text x="2099.8" y="230" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">El pixel art solo se ve nítido con escala entera. 768/1080 = 0.71 haría</text>
<text x="2099.8" y="252" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">píxeles de tamaños distintos. Se usa el mayor entero que quepa:</text>
<text x="2099.8" y="274" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">×3 en 1920×1080 · ×2 en 1366×768 y 1280×720 · ×4 en 2560×1440.</text>
<text x="2065.8" y="304" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="17" fill="#D6336C" text-anchor="start" font-weight="bold" xml:space="preserve">Qué pasa con la interfaz</text>
<text x="2099.8" y="330" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Editor, etiquetas, trazas y copiloto se dibujan a resolución nativa</text>
<text x="2099.8" y="352" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">(no pixelados), con un tamaño mínimo de 14 px en el código.</text>
<text x="2065.8" y="382" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="17" fill="#D6336C" text-anchor="start" font-weight="bold" xml:space="preserve">Requerimiento nuevo propuesto para el PDS</text>
<text x="2099.8" y="408" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">RI-07: en 1366×768 el código se muestra a ≥14 px con ≥20 líneas</text>
<text x="2099.8" y="430" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">visibles y las etiquetas de pin a ≥13 px.</text>
<text x="2099.8" y="452" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Verificación: captura en una laptop real de 1366×768; 5 de 5</text>
<text x="2099.8" y="474" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">usuarios leen la etiqueta del motor a 60 cm de la pantalla.</text>
